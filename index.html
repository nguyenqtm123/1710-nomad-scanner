
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1710 NOMAD PASS Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 22px 16px;
      background: #111714;
      color: #f5f2e9;
      font-family: Arial, sans-serif;
    }
    .container { max-width: 480px; margin: auto; }
    .brand { text-align: center; margin: 12px 0 24px; }
    .brand h1 { letter-spacing: 3px; margin-bottom: 6px; }
    .brand p { color: #b8c2b9; font-size: 13px; }
    .panel {
      background: #202923;
      padding: 18px;
      border-radius: 16px;
      margin-bottom: 16px;
    }
    label { display: block; margin: 12px 0 7px; font-size: 13px; }
    input {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #526256;
      background: #151d18;
      color: white;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 9px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }
    button:disabled { opacity: .4; cursor: not-allowed; }
    .primary { background: #c6a66b; color: #171b16; }
    .secondary { background: #35463a; color: white; }
    .reward { background: #d5b99a; color: #174b49; }
    #reader { width: 100%; overflow: hidden; border-radius: 10px; }
    #status {
      margin-top: 14px;
      padding: 13px;
      border-radius: 9px;
      background: #151d18;
      line-height: 1.5;
      white-space: pre-line;
      font-size: 14px;
    }
    .hint {
      color: #b8c2b9;
      font-size: 12px;
      line-height: 1.5;
    }
    .bridge {
      font-size: 11px;
      color: #b8c2b9;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">
      <h1>1710</h1>
      <p>CAFÉ & SOCIETY · NOMAD PASS</p>
    </div>

    <div class="panel">
      <label>Tên nhân viên</label>
      <input id="staff" placeholder="Nhập tên nhân viên" autocomplete="name">

      <label>Mã PIN nhân viên</label>
      <input id="pin" type="password" placeholder="Nhập mã PIN">
    </div>

    <div class="panel">
      <div id="reader"></div>
      <button class="primary" id="start">
        BẬT CAMERA QUÉT QR
      </button>
      <button class="secondary" id="stop">TẮT CAMERA</button>
      <button class="reward" id="redeem" disabled>
        ĐỔI QUÀ THÀNH VIÊN
      </button>
      <div id="status">Đang kết nối NOMAD PASS...</div>
      <div class="bridge" id="bridgeStatus">Đang kiểm tra kết nối API</div>
    </div>

    <p class="hint">
      Kiểm tra tên nhân viên và mã PIN trước khi quét.
      Mỗi thành viên chỉ được ghi nhận lượt ghé một lần mỗi ngày.
    </p>
  </div>

<script>
  const API_URL =
    "https://1710-nomad-pass-api.nguyenqtm123.workers.dev/";

  const startButton = document.getElementById("start");
  const redeemButton = document.getElementById("redeem");
  const statusBox = document.getElementById("status");
  const bridgeStatus = document.getElementById("bridgeStatus");

  let scanner = null;
  let busy = false;
  let activeToken = "";

  function showStatus(message) {
    statusBox.textContent = message;
  }

  function getToken(value) {
    try {
      const url = new URL(value);
      return url.searchParams.get("token") || value.trim();
    } catch (error) {
      return value.trim();
    }
  }

  async function callAPI(action, token) {
    const staffName = document.getElementById("staff").value.trim();
    const pin = document.getElementById("pin").value.trim();

    if (!staffName || !pin) {
      throw new Error("Vui lòng nhập tên nhân viên và mã PIN.");
    }

    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        action: action,
        token: token,
        pin: pin,
        staffName: staffName
      })
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.message || "Lỗi kết nối API.");
    }

    return result;
  }

  async function checkIn(token) {
    try {
      showStatus("Đã đọc QR.\nĐang xác nhận check-in...");

      const result = await callAPI("CHECK_IN", token);

      showStatus(
        (result.ok
          ? "CHECK-IN THÀNH CÔNG\n\n"
          : "CHECK-IN CHƯA THÀNH CÔNG\n\n") +
        (result.message || "Không có thông tin phản hồi.") +
        (result.visits !== undefined
          ? "\nLượt ghé: " + result.visits
          : "") +
        (result.points !== undefined
          ? "\nĐiểm: " + result.points
          : "") +
        (result.nextResetDate
          ? "\nNgày kết thúc chu kỳ: " + result.nextResetDate
          : "")
      );

      // Cho phép kiểm tra đổi quà kể cả khi check-in bị từ chối
      // vì thành viên đã check-in trong ngày.
      redeemButton.disabled = false;

    } catch (error) {
      showStatus("LỖI KẾT NỐI\n\n" + error.message);
      redeemButton.disabled = true;
    } finally {
      busy = false;
    }
  }

  async function startScanner() {
    if (scanner || busy) return;

    const staffName = document.getElementById("staff").value.trim();
    const pin = document.getElementById("pin").value.trim();

    if (!staffName || !pin) {
      showStatus("Vui lòng nhập tên nhân viên và mã PIN trước khi quét.");
      return;
    }

    try {
      scanner = new Html5Qrcode("reader");
      showStatus("Đang mở camera...");

      await scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 240, height: 240 } },
        async function(decodedText) {
          if (busy) return;

          busy = true;
          const token = getToken(decodedText);

          if (!token) {
            busy = false;
            showStatus("Không đọc được mã thành viên.");
            return;
          }

          activeToken = token;
          redeemButton.disabled = true;

          try {
            await scanner.stop();
            scanner.clear();
          } catch (error) {}

          scanner = null;
          await checkIn(token);
        }
      );

      showStatus("Camera đã bật. Hướng mã QR vào khung quét.");

    } catch (error) {
      if (scanner) {
        try { scanner.clear(); } catch (e) {}
      }
      scanner = null;
      showStatus("Không mở được camera: " + error);
    }
  }

  async function stopScanner() {
    if (scanner) {
      try {
        await scanner.stop();
        scanner.clear();
      } catch (error) {}

      scanner = null;
    }

    busy = false;
    showStatus("Đã tắt camera.");
  }

  async function redeemReward() {
    if (busy || !activeToken) return;

    if (!window.confirm("Xác nhận đổi quà cho thành viên này?")) {
      return;
    }

    busy = true;
    redeemButton.disabled = true;

    try {
      showStatus("Đang xác nhận đổi quà...");

      const result = await callAPI("REDEEM", activeToken);

      showStatus(
        (result.ok
          ? "ĐỔI QUÀ THÀNH CÔNG\n\n"
          : "CHƯA ĐỔI ĐƯỢC QUÀ\n\n") +
        (result.message || "Không có thông tin phản hồi.")
      );

      if (result.ok) {
        activeToken = "";
      } else {
        redeemButton.disabled = false;
      }

    } catch (error) {
      showStatus("LỖI KẾT NỐI\n\n" + error.message);
      redeemButton.disabled = false;
    } finally {
      busy = false;
    }
  }

  async function testConnection() {
    try {
      const response = await fetch(API_URL, {
        method: "OPTIONS"
      });

      if (response.ok) {
        bridgeStatus.textContent = "Đã kết nối được Cloudflare Worker";
        showStatus("Hệ thống sẵn sàng. Nhập thông tin nhân viên để bắt đầu.");
      } else {
        throw new Error("Worker phản hồi không hợp lệ.");
      }
    } catch (error) {
      bridgeStatus.textContent = "Chưa kết nối được API";
      showStatus("Lỗi kết nối hệ thống. Vui lòng tải lại trang.");
    }
  }

  startButton.addEventListener("click", startScanner);
  document.getElementById("stop").addEventListener("click", stopScanner);
  redeemButton.addEventListener("click", redeemReward);

  testConnection();
</script>
</body>
</html>
